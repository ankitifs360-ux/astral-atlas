name: astral-atlas

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped

    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']

    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrate

    image: astral-atlas-migrate:local
    restart: 'no'

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

  zip-staging-init:
    image: node:22.23.3-bookworm-slim
    restart: 'no'
    user: root

    command:
      - sh
      - -c
      - >
        mkdir -p /tmp/astral-atlas/zip-staging &&
        chown -R 1000:1000 /tmp/astral-atlas/zip-staging &&
        chmod 0770 /tmp/astral-atlas/zip-staging

    volumes:
      - zip_staging_data:/tmp/astral-atlas/zip-staging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    image: astral-atlas-api:local
    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      HOST: 0.0.0.0
      PORT: 3000

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_TLS: 'false'

    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

    volumes:
      - zip_staging_data:/tmp/astral-atlas/zip-staging

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zip-staging-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile

    image: astral-atlas-worker:local
    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_TLS: 'false'

    volumes:
      - zip_staging_data:/tmp/astral-atlas/zip-staging

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zip-staging-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  zip_staging_data:
