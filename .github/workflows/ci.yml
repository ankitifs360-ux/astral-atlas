name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # API/worker package exports point at dist, so shared workspace
      # libraries must exist before consumers are typechecked/tested.
      - name: Build shared package
        run: pnpm --filter @astral-atlas/shared build

      - name: Build database package
        run: pnpm --filter @astral-atlas/database build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Build API
        run: pnpm --filter @astral-atlas/api build

      - name: Build worker
        run: pnpm --filter @astral-atlas/worker build

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://astral:astral_ci@127.0.0.1:5432/astral_atlas
      RUN_DB_INTEGRATION_TESTS: 'true'

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DATABASE: '0'
      REDIS_TLS: 'false'

    services:
      postgres:
        image: postgres:18.6-alpine3.24

        env:
          POSTGRES_DB: astral_atlas
          POSTGRES_USER: astral
          POSTGRES_PASSWORD: astral_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U astral -d astral_atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.10.2-alpine3.23

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Build shared package
        run: pnpm --filter @astral-atlas/shared build

      - name: Build database package
        run: pnpm --filter @astral-atlas/database build

      - name: Run integration tests
        run: pnpm test:integration

  docker:
    name: Production Docker images and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - integration

    env:
      POSTGRES_DB: astral_atlas
      POSTGRES_USER: astral
      POSTGRES_PASSWORD: astral_ci
      POSTGRES_PORT: '5432'

      REDIS_PORT: '6379'

      API_PORT: '3000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build migration image
        run: docker compose build migrate

      - name: Build API image
        run: docker compose build api

      - name: Build worker image
        run: docker compose build worker

      - name: Start production stack
        run: docker compose up -d api worker

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${API_PORT}/health" \
              > /tmp/astral-health.json
            then
              cat /tmp/astral-health.json
              exit 0
            fi

            echo "Waiting for API health endpoint (${attempt}/30)..."
            sleep 2
          done

          echo "API health endpoint did not become ready."
          docker compose ps
          docker compose logs --no-color api worker migrate postgres redis
          exit 1

      - name: Verify API readiness
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "http://127.0.0.1:${API_PORT}/ready" \
            | tee /tmp/astral-ready.json

      - name: Verify worker is running
        shell: bash
        run: |
          set -euo pipefail

          if ! docker compose ps \
            --status running \
            --services \
            | grep --quiet --line-regexp 'worker'
          then
            echo "Worker container is not running."
            docker compose ps
            docker compose logs --no-color worker
            exit 1
          fi

          docker compose ps worker

      - name: Show runtime status
        run: docker compose ps

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs \
            --no-color \
            api \
            worker \
            migrate \
            postgres \
            redis

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans
